name: Build prototype APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: inkcalidraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (writes Excalidraw fixtures)
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check fixtures against the real Excalidraw package
        working-directory: tools/compat
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run check

      - name: Build APK
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export LIVE_RELAY=$(.github/scripts/relay-url.sh || true)
          echo "Live relay built into the APK: ${LIVE_RELAY:-none}"
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: inkcalidraw-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Excalidraw render check
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: excalidraw-render-check-${{ github.run_number }}
          path: |
            fixtures/*.png
            fixtures/*.excalidraw
          if-no-files-found: ignore


  obsidian-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test the plugin
        working-directory: obsidian-plugin
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          PLAYWRIGHT_PATH=playwright npm test
      - uses: actions/upload-artifact@v4
        with:
          name: inkcalidraw-obsidian-${{ github.run_number }}
          path: obsidian-plugin/dist/
  device-tests:
    # Runs the editor on an Android tablet emulator with synthetic S Pen input and saves screenshots.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Start a local live relay for the emulator (reached at 10.0.2.2)
        working-directory: live/relay
        run: |
          npm ci --no-audit --no-fund
          nohup npx wrangler dev --local --ip 0.0.0.0 --port 8787 > ../../relay.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/ && break; sleep 2; done

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run device tests on a tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain AOSP image: no Play services, which kept ANR-ing on the CI machine and covering the app.
          target: default
          arch: x86_64
          profile: pixel_tablet
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Installed and run by hand (not connectedAndroidTest) so the app isn't uninstalled before we pull screenshots.
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e liveRelay http://10.0.2.2:8787 dev.inkcalidraw.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt || true
            mkdir -p device-screens && adb pull /sdcard/Android/data/dev.inkcalidraw/files/screens device-screens/ || true
            cp instrument.txt device-screens/ || true
            adb logcat -d -v time > device-screens/logcat.txt || true
            adb shell 'ls /data/anr' > device-screens/anr-list.txt 2>&1 || true
            adb shell 'cat /data/anr/anr_* 2>/dev/null | head -400' > device-screens/anr-traces.txt 2>&1 || true
            grep -E "^(OK|FAILURES|Tests run)" instrument.txt || true
            grep -q "^OK (" instrument.txt

      - name: Replay what the tablet sent into the web viewer
        if: always() && hashFiles('device-screens/screens/live-messages.jsonl') != ''
        working-directory: live/viewer
        run: |
          npm ci --no-audit --no-fund
          VITE_RELAY_URL=http://127.0.0.1:8797 npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          PLAYWRIGHT_PATH=playwright node test/replay.mjs ../../device-screens/screens/live-messages.jsonl ../../device-screens/screens

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-test-screens-${{ github.run_number }}
          path: |
            device-screens/
            relay.log
          if-no-files-found: ignore

  release:
    # Keeps a "latest" GitHub release with the newest APK and Obsidian plugin (the homepage links to these files).
    needs: [build, obsidian-plugin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: inkcalidraw-apk-${{ github.run_number }}
          path: apk
      - uses: actions/download-artifact@v5
        with:
          name: inkcalidraw-obsidian-${{ github.run_number }}
          path: plugin
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk inkcalidraw.apk
          (cd plugin && zip -q ../inkcalidraw-obsidian.zip main.js manifest.json styles.css)
          notes="Newest build from main (${GITHUB_SHA::7}). Install inkcalidraw.apk on the tablet; unzip inkcalidraw-obsidian.zip into <vault>/.obsidian/plugins/inkcalidraw/."
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest inkcalidraw.apk inkcalidraw-obsidian.zip --target "$GITHUB_SHA" --title "Latest build" --notes "$notes" --latest
