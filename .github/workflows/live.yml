name: Live mirror (relay + viewer)

on:
  push:
    branches: [main]
    paths: ["live/**", "site/**", ".github/workflows/live.yml", ".github/scripts/relay-url.sh"]
  workflow_dispatch:

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Relay protocol test (wrangler dev)
        working-directory: live/relay
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: Viewer end-to-end test (headless Chromium)
        working-directory: live/viewer
        run: |
          npm ci --no-audit --no-fund
          VITE_RELAY_URL=http://127.0.0.1:8798 npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          PLAYWRIGHT_PATH=playwright npm test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-viewer-screens-${{ github.run_number }}
          path: live/viewer/test/out/
          if-no-files-found: ignore

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # publishes the viewer to the gh-pages branch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add a CLOUDFLARE_API_TOKEN repository secret (template: Edit Cloudflare Workers) to deploy the relay and viewer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the homepage is built from its source
        run: |
          cd site/tools && npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
          node strokes.mjs > /dev/null && node build.mjs
          git diff --exit-code -- ../index.html ../strokes.json || { echo "::error::Run node site/tools/strokes.mjs && node site/tools/build.mjs and commit site/index.html"; exit 1; }
      - name: Deploy the relay to Cloudflare
        id: relay
        if: steps.token.outputs.ok == 'true'
        working-directory: live/relay
        run: |
          url=$(../../.github/scripts/relay-url.sh --ensure-subdomain)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          npm ci --no-audit --no-fund
          npx wrangler deploy
          for i in $(seq 1 20); do curl -fsS "$url/" && break; sleep 3; done
          echo "Relay: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the deployed relay (tablet and viewers over real WebSockets, throwaway code)
        if: steps.token.outputs.ok == 'true'
        working-directory: live/relay
        run: RELAY_URL="${{ steps.relay.outputs.url }}" npm test
      - name: Build the viewer
        if: steps.token.outputs.ok == 'true'
        working-directory: live/viewer
        run: |
          npm ci --no-audit --no-fund
          VITE_RELAY_URL="${{ steps.relay.outputs.url }}" npm run build
      - name: Publish homepage and viewer to GitHub Pages (gh-pages branch)
        if: steps.token.outputs.ok == 'true'
        run: |
          mkdir -p public
          cp site/index.html site/favicon.svg public/ && cp -r site/fonts public/fonts
          # links point at this repository (so renaming the repo needs no code change)
          sed -i "s#github.com/fabsch225/inkcalidraw#github.com/${GITHUB_REPOSITORY}#g" public/index.html
          cp -r live/viewer/dist public/live
          touch public/.nojekyll
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Site: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/ (viewer at /live/; enable Pages from the gh-pages branch if it isn't live)" >> "$GITHUB_STEP_SUMMARY"
