name: Live mirror (relay + viewer)

on:
  push:
    branches: [main]
    paths: ["live/**", ".github/workflows/live.yml", ".github/scripts/relay-url.sh"]
  workflow_dispatch:

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Relay protocol test (wrangler dev)
        working-directory: live/relay
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: Viewer end-to-end test (headless Chromium)
        working-directory: live/viewer
        run: |
          npm ci --no-audit --no-fund
          VITE_RELAY_URL=http://127.0.0.1:8798 npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          PLAYWRIGHT_PATH=playwright npm test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-viewer-screens-${{ github.run_number }}
          path: live/viewer/test/out/
          if-no-files-found: ignore

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the viewer to the gh-pages branch
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add a CLOUDFLARE_API_TOKEN repository secret (template: Edit Cloudflare Workers) to deploy the relay and viewer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy the relay to Cloudflare
        id: relay
        if: steps.token.outputs.ok == 'true'
        working-directory: live/relay
        run: |
          url=$(../../.github/scripts/relay-url.sh --ensure-subdomain)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          npm ci --no-audit --no-fund
          npx wrangler deploy
          for i in $(seq 1 20); do curl -fsS "$url/" && break; sleep 3; done
          echo "Relay: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the viewer
        if: steps.token.outputs.ok == 'true'
        working-directory: live/viewer
        run: |
          npm ci --no-audit --no-fund
          VITE_RELAY_URL="${{ steps.relay.outputs.url }}" npm run build
          touch dist/.nojekyll
      - name: Publish the viewer to GitHub Pages (gh-pages branch)
        if: steps.token.outputs.ok == 'true'
        run: |
          cd live/viewer/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Viewer for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Viewer: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/ (enable Pages from the gh-pages branch if it isn't live)" >> "$GITHUB_STEP_SUMMARY"
